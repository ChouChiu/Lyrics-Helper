[package]
name = "lyrics-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lyrics search functionality for various platforms"
readme = "README.md"

[dependencies]
# 整个 crate 都在 `search` feature 之后，关掉它时不拉入任何依赖。
lyrics-core = { path = "../lyrics-core", version = "0.5.0", optional = true }
lyrics-crypto = { path = "../lyrics-crypto", version = "0.5.0", optional = true }
lyrics-parsers = { path = "../lyrics-parsers", version = "0.5.0", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[features]
default = ["search"]
search = [
    "dep:lyrics-core",
    "dep:lyrics-crypto",
    "dep:lyrics-parsers",
    "dep:serde",
    "dep:serde_json",
    "dep:regex",
    "dep:rand",
    "dep:reqwest",
    "dep:tokio",
    "dep:async-trait",
    "dep:urlencoding",
    "dep:base64",
]
