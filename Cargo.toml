[workspace]
members = [
    "lyrics-core",
    "lyrics-parsers",
    "lyrics-generators",
    "lyrics-crypto",
    "lyrics-search",
    "lyrics-helper",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["ChouChiu"]
repository = "https://github.com/ChouChiu/Lyrics-Helper"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
regex = "1.13.1"
quick-xml = "0.42.0"
aes = "0.9.3"
md-5 = "0.11.0"
flate2 = "1.1.10"
base64 = "0.23.1"
reqwest = { version = "0.13.5", features = ["json", "form", "rustls"] }
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.92"
urlencoding = "2.1.3"
rand = "0.10.3"
pretty_assertions = "1.4.1"
ferrous-opencc = { version = "0.4.0", features = ["s2t-conversion", "t2s-conversion"] }
